buildscript {
    dependencies {
        classpath 'org.codehaus.groovy:groovy-json:3.0.9'
    }
}

plugins {
    id 'fabric-loom' version '1.13.1'
    id 'maven-publish'
}

base.archivesName = project.archives_base_name
version = project.mod_version + "+mc" + project.minecraft_version
group = project.maven_group

repositories {
    mavenCentral()

    maven { url "https://maven.fabricmc.net/" }
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.terraformersmc.com/" }
    maven { url "https://maven.saps.dev/minecraft" }
    maven { url "https://maven.bai.lol/" }
    maven { url "https://maven.wispforest.io" }
    maven { url "https://maven.architectury.dev/" }
    maven { url "https://maven.quiltmc.org/repository/release" }
    maven {
        url "https://maven.isxander.dev/releases"
        content {
            includeGroup "dev.isxander"
        }
    }
    maven {
        url "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        url "https://jitpack.io"
        content {
            includeGroupByRegex("com\\.github\\..+")
        }
    }
}

var settings = new Object() {
    boolean wthit
    boolean megane
    boolean modmenu
    boolean rei
    boolean emi
    boolean techReborn
    boolean industrialRevolution
    boolean modernIndustrialization
    boolean jade
}
apply from: "config.gradle", to: settings

sourceSets {
    main {
        java {
            exclude 'wraith/fabricaeexnihilo/datagen/**'
            if (!settings.rei) {
                exclude 'wraith/fabricaeexnihilo/compatibility/rei/**'
            }
            if (!settings.emi) {
                exclude 'wraith/fabricaeexnihilo/compatibility/emi/**'
            }
            if (!settings.rei && !settings.emi) {
                exclude 'wraith/fabricaeexnihilo/compatibility/recipeviewer/**'
            }
            if (!settings.jade) {
                exclude 'wraith/fabricaeexnihilo/compatibility/jade/**'
            }
            if (!settings.wthit) {
                exclude 'wraith/fabricaeexnihilo/compatibility/wthit/**'
            }
            if (!settings.megane) {
                exclude 'wraith/fabricaeexnihilo/compatibility/megane/**'
            }
            if (!settings.modmenu) {
                exclude 'wraith/fabricaeexnihilo/client/config/ModmenuPlugin.java'
            }
        }
        resources {
            srcDir("src/main/generated")
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:$minecraft_version"
    mappings "net.fabricmc:yarn:$yarn_mappings:v2"
    modImplementation "net.fabricmc:fabric-loader:$loader_version"

    modImplementation "net.fabricmc.fabric-api:fabric-api:$fabric_version"

    modImplementation include("dev.isxander:yet-another-config-lib:$yacl_version")
    modImplementation include("com.github.mattidragon:configtoolkit:$configtoolkit_version")

    // Add generated data to runtime classpath
    runtimeOnly files("src/main/generated")

    if (settings.rei) {
        modCompileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:$rei_version"
        modCompileOnly "dev.architectury:architectury-fabric:$architectury_version"
        modRuntimeOnly "me.shedaniel:RoughlyEnoughItems-fabric:$rei_version"
        modRuntimeOnly "dev.architectury:architectury-fabric:$architectury_version"
    }
    if (settings.emi) {
        modCompileOnly "dev.emi:emi-fabric:$emi_version:api"
        modRuntimeOnly "dev.emi:emi-fabric:$emi_version"
    }
    if (settings.modmenu) {
        modCompileOnly "com.terraformersmc:modmenu:$modmenu_version"
        modRuntimeOnly "com.terraformersmc:modmenu:$modmenu_version"
    }
    if (settings.techReborn) {
        modRuntimeOnly "TechReborn:TechReborn-1.19:$tech_reborn_version"
    }
    if (settings.modernIndustrialization) {
        modRuntimeOnly "maven.modrinth:modern-industrialization:$modern_industrialization_version"
    }
    if (settings.industrialRevolution) {
        modRuntimeOnly "curse.maven:industrial-revolution-391708:$industrial_revolution_version"
    }
    if (settings.wthit) {
        modCompileOnly "mcp.mobius.waila:wthit-api:fabric-$wthit_version"
        modRuntimeOnly "mcp.mobius.waila:wthit:fabric-$wthit_version"
    }
    if (settings.megane) {
        // Compile against the same API version that ships at runtime. Pinning an
        // older API here lets the code compile against methods that no longer
        // exist in the version the game actually loads.
        modCompileOnly "lol.bai.megane:megane-api:$megane_version"
        modRuntimeOnly "lol.bai:badpackets:fabric-0.1.2"
        modRuntimeOnly "lol.bai.megane:megane-runtime:$megane_version"
        modRuntimeOnly "lol.bai.megane:megane-vanilla:$megane_version"
        modRuntimeOnly "lol.bai.megane:megane-api:$megane_version"
    }
    if (settings.jade) {
        modCompileOnly "maven.modrinth:jade:$jade_version+fabric"
        modRuntimeOnly "maven.modrinth:jade:$jade_version+fabric"
    }
}

loom {
    runs {
        datagen {
            inherit server
            name "Data Generation"
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.output-dir=${file("src/main/generated")}"
            vmArg "-Dfabric-api.datagen.modid=fabricaeexnihilo"

            ideConfigGenerated = true
            runDir "build/datagen/"
        }
    }

    mods {
        fabricaeexnihilo {
            sourceSet sourceSets.main
            modFiles.from file("src/main/generated")
        }
    }
}

tasks.register('copyDatagenOverrides', Copy) {
    from "run/config/fabric_loader_dependencies.json"
    into "build/datagen/config"
}
clean.finalizedBy(tasks.copyDatagenOverrides)
tasks.runDatagen.dependsOn(tasks.copyDatagenOverrides)

clean.delete("src/main/generated")

import groovy.json.JsonException
import groovy.json.JsonSlurper
import groovy.json.JsonOutput

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }

    doLast {
        fileTree(dir: outputs.files.asPath, include: "**/*.json").each { File file ->
            try {
                file.text = JsonOutput.toJson(new JsonSlurper().parse(file))
            } catch (JsonException e) {
                throw new RuntimeException("Failed to minify json for $file", e)
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release.set(21)
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from("LICENSE") {
        rename { "${it}_${archives_base_name}" }
    }
    from("src/main/generated") {
        exclude "README.md"
        exclude ".cache"
    }
}

publishing {
    publications.register("mavenJava", MavenPublication) {
        from components.java
    }
}

tasks.named('runServer') {
    systemProperty 'fabricaeexnihilo.test', System.getProperty('fabricaeexnihilo.test', 'false')
    environment 'FEN_TEST', System.getenv('FEN_TEST') ?: 'false'
}
